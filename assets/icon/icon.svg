<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- PoE Upgrade Finder: a magnifying glass (finding) with an up chevron in the lens (upgrade).
       Colours are the app accent (#f0b44c) on its dark surface. Rendered to icon.ico by tools/icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a35"/>
      <stop offset="1" stop-color="#121419"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd88a"/>
      <stop offset="0.55" stop-color="#f0b44c"/>
      <stop offset="1" stop-color="#c9821f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.44" cy="0.44" r="0.5">
      <stop offset="0" stop-color="#f0b44c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f0b44c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="52.5" fill="none" stroke="#f0b44c" stroke-opacity="0.22" stroke-width="3"/>
  <circle cx="110" cy="110" r="78" fill="url(#glow)"/>
  <line x1="157" y1="157" x2="205" y2="205" stroke="url(#gold)" stroke-width="32" stroke-linecap="round"/>
  <circle cx="110" cy="110" r="60" fill="#171a21" stroke="url(#gold)" stroke-width="22"/>
  <polyline points="80,128 110,96 140,128" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
